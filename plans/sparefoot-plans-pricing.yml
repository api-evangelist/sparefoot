    timeFrame: tenancy
    geo: US
    unit: 1
    price: percentage of collected rent per move-in (rate not publicly disclosed; third-party operator reports cite 2-5 months' equivalent rent over a tenancy)
    userMultiplied: false
  elements:
  - name: Marketplace Listing
  - name: Verified Reservation Leads
- id: sparefoot-negotiated-partner-agreement
  name: Negotiated Facility/Partner Agreement (Current)
  type: enterprise
  description: >-
    Current facility participation - reached either directly or through a
    property-management software partner's data-feed integration (Storable
    Edge, SiteLink, Storable Easy, Self Storage Manager, eDOMICO, DoorSwap) -
    is understood to be a negotiated cost-per-reservation or percentage-of-rent
    agreement set with SpareFoot/Storable sales, not a published self-serve
    tier.
  entries:
  - label: Negotiated Agreement
    name: negotiated_agreement
    type: flat
    metric: facility
    limit: -1
    timeFrame: contract
    geo: US
    unit: 1
    price: contact SpareFoot/Storable sales
    userMultiplied: false
  elements:
  - name: Marketplace Listing
  - name: Partner Data-Feed Integration (no public API)
  - name: Reservation/Lead Delivery
- id: sparefoot-pay-per-move-in
  name: Marketplace Listing - Pay Per Move-In (First-Party, Current)
  type: usage
  description: >-
    SpareFoot's own facility-operator site states the current model plainly: listing on
    the marketplace is free with no signup fee, and the facility pays only when a
    SpareFoot-referred customer actually moves in. No rate is published - "Your exact
    pricing is based on storage demand in your area, as well as the amount of facilities
    we already have on the network in your area" - so the number is quoted per market by
    SpareFoot's team. Sign-up is self-serve at https://my.sparefoot.com/signup-start.
  entries:
  - label: Per Verified Move-In
    name: pay_per_move_in
    type: usage
    metric: verified_move_in
    limit: -1
    timeFrame: perMoveIn
    geo: US
    unit: 1
    price: not published - quoted per market by SpareFoot
    userMultiplied: false
  - label: Listing Fee
    name: listing_fee
    type: flat
    metric: facility
    limit: -1
    timeFrame: month
    geo: US
    unit: 1
    price: '0'
    currency: USD
    userMultiplied: false
  elements:
  - name: Marketplace Listing (free)
  - name: Verified Move-In Billing
  - name: Optional Management-Software Integration
  source: https://marketing.sparefoot.com/
