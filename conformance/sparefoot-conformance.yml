provider: SpareFoot
providerId: sparefoot
description: >-
  Assertions about cross-cutting industry standards and published compliance programs
  for SpareFoot. Every entry below is `conforms: false`. SpareFoot publishes no
  machine-readable contract, so no standard can be asserted from a spec; and the one
  compliance program in the Storable family that could have been cited EXPLICITLY
  EXCLUDES SpareFoot from its scope. No `Compliance` and no `TrustCenter` pointer is
  emitted in apis.yml.
conformance:
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document is published. Probed /openapi.json and /swagger.json
    on www.sparefoot.com (403 Cloudflare interstitial); no api.sparefoot.com,
    developer.sparefoot.com or developers.sparefoot.com DNS record exists;
    docs.sparefoot.com resolves but answers 403 behind a bot challenge.
- id: asyncapi
  conforms: false
  evidence: >-
    No event, streaming, or webhook contract is published. The facility data feed is
    described in prose only, with no protocol, schema, or endpoint disclosed.
- id: graphql
  conforms: false
  evidence: No /graphql surface is documented or discoverable on any SpareFoot host.
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0 surface. /.well-known/oauth-authorization-server on www.sparefoot.com
    returned 200 with the site's HTML shell, not authorization-server metadata.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration on www.sparefoot.com returned 200 with the site's
    HTML shell, not an OpenID Provider configuration document.
- id: rfc9457
  conforms: false
  evidence: >-
    No error contract is published, so no application/problem+json envelope can be
    asserted.
- id: rfc9116
  conforms: false
  evidence: >-
    No security.txt. www.sparefoot.com/.well-known/security.txt answers 200 with the
    HTML application shell (catch-all, not a document); support.sparefoot.com returns
    404; www.storable.com/.well-known/security.txt returns a real 404.
- id: rfc8594
  conforms: false
  evidence: No Sunset/Deprecation header policy is documented. See lifecycle/.
- id: idempotency
  conforms: false
  evidence: No idempotency semantics are documented; there is no public request surface.
- id: pagination
  conforms: false
  evidence: No pagination convention is documented; there is no public request surface.
