    - Storable Easy
    - Storable Edge
    - Storable Molo
    - Storable Newbook
    - Storable Payments
    evidence: >-
      The trust center's own description enumerates the products it covers, verbatim:
      "The following Storable products are included in the trust and security portal:
      Sitelink by Storable / Storable CRM / Storable Easy / Storable Edge /
      Storable Molo / Storable Newbook / Storable Payments." SpareFoot is not on that
      list, even though it is a Storable brand and appears on the shared status page.
    note: >-
      OWNERSHIP RULE APPLIED. It would have been easy - and wrong - to credit SpareFoot
      with the parent's SOC 2 / PCI posture because trust.storable.com sits inside the
      same corporate family. The trust center says in its own words which products it
      covers, and SpareFoot is not one of them. No `Compliance`, `TrustCenter` or
      certification claim is recorded for SpareFoot on this evidence.
  certifications: []
  certifications_note: >-
